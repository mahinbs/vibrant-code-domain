
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Tracking. Every pixel's queue (dataLayer/gtag, clarity, fbq, twq) exists from the first line,
      so no PageView or conversion is lost — but the tracking scripts themselves download only after
      the page has loaded (or at the visitor's first tap, whichever comes first), so they no longer
      compete with the page for a phone's CPU. Nothing tracking-related runs while the site is being
      pre-rendered (window.__PRERENDER__), so a build never counts as a visit.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      (function () {
        if (window.__PRERENDER__) return;
        var host = location.hostname;
        if (/(^|\.)lovable\.app$/i.test(host)) { console.warn('Ads/Analytics disabled on Lovable preview domain:', host); return; }

        var pending = [];
        function later(src) { pending.push(src); }
        var loaded = false;
        function loadAll() {
          if (loaded) return; loaded = true;
          pending.forEach(function (src) { var t = document.createElement('script'); t.async = true; t.src = src; document.head.appendChild(t); });
        }
        window.addEventListener('load', function () { setTimeout(loadAll, 1200); });
        ['pointerdown', 'keydown', 'scroll', 'touchstart'].forEach(function (ev) { window.addEventListener(ev, loadAll, { once: true, passive: true }); });

        // Microsoft Clarity
        window.clarity = window.clarity || function () { (window.clarity.q = window.clarity.q || []).push(arguments); };
        later('https://www.clarity.ms/tag/wpv9phmclr');

        // Google Ads / Analytics (gtag)
        function gtag() { window.dataLayer.push(arguments); }
        window.gtag = window.gtag || gtag;
        gtag('js', new Date());
        // The click an ad brought is carried to www.boostmysites.in, where people sign up.
        gtag('set', 'linker', { domains: ['boostmysites.com', 'boostmysites.in'] });
        gtag('config', 'AW-10794572231');
        gtag('config', 'AW-18249809652');
        gtag('config', 'AW-18294430151');
        gtag('config', 'G-6RG271FTBN');
        later('https://www.googletagmanager.com/gtag/js?id=AW-10794572231');

        // Google Tag Manager (GTM-PVFCC7LB)
        window.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
        later('https://www.googletagmanager.com/gtm.js?id=GTM-PVFCC7LB');

        // Meta Pixel — base code site-wide (SPA: extra PageViews from React on route changes)
        if (!window.fbq) {
          var n = window.fbq = function () { n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments); };
          if (!window._fbq) window._fbq = n;
          n.push = n; n.loaded = true; n.version = '2.0'; n.queue = [];
          later('https://connect.facebook.net/en_US/fbevents.js');
        }
        fbq('init', '903780897993326');
        fbq('init', '1111374821412453');
        fbq('track', 'PageView');

        // X (Twitter) conversion tracking — base pixel (site visits, all pages)
        if (!window.twq) {
          var q = window.twq = function () { q.exe ? q.exe.apply(q, arguments) : q.queue.push(arguments); };
          q.version = '1.1'; q.queue = [];
          later('https://static.ads-twitter.com/uwt.js');
        }
        twq('config', 'oqroz');
      })();
    </script>

    <!-- Inter: loaded without blocking the first paint (font-display: swap) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
